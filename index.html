<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Repeater Finder | Open Tactical Trip Planner</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0a0c10;
            --surface: rgba(25, 30, 40, 0.85);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.3);
            --text: #e0e6ed;
            --text-dim: #94a3b8;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 1rem 2rem;
            background: rgba(10, 12, 16, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .logo { font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 0.5rem; font-size: 1.25rem; }
        .logo span { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }

        .status-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }

        main { flex: 1; display: grid; grid-template-columns: 400px 1fr; position: relative; }

        .sidebar {
            background: rgba(15, 20, 25, 1);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            overflow-y: auto;
            z-index: 100;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .card h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); margin-bottom: 0.25rem; }

        .input-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .input-group label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; }

        input, select, button {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            color: white;
            font-family: inherit;
            width: 100%;
        }

        button {
            background: var(--accent);
            color: black;
            font-weight: 800;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        button:hover { filter: brightness(1.1); transform: translateY(-1px); }
        button:disabled { background: #333; color: #666; cursor: not-allowed; transform: none; }
        button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

        #map-container { position: relative; }
        #map { width: 100%; height: 100%; background: #0a0c10; }

        .results-panel {
            position: absolute;
            top: 2rem;
            right: 2rem;
            width: 380px;
            max-height: calc(100vh - 8rem);
            background: var(--surface);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }

        .results-header { 
            padding: 1.25rem; 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(0,0,0,0.2);
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .results-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 1rem; 
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
        }

        .results-list::-webkit-scrollbar { width: 6px; }
        .results-list::-webkit-scrollbar-track { background: transparent; }
        .results-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        .results-list::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .repeater-item {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            background: rgba(255,255,255,0.03);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.5rem;
            border: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .repeater-item:hover { border-color: var(--accent); }
        .repeater-call { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--accent); font-size: 1.1rem; }
        .repeater-freq { font-family: 'JetBrains Mono', monospace; font-weight: 700; }

        .hidden { display: none; }
        
        /* Leaflet Dark Customization */
        .leaflet-container { background: var(--bg) !important; }
        .leaflet-bar a { background: var(--surface) !important; color: white !important; border: 1px solid var(--border) !important; }

    </style>
</head>
<body>

    <header>
        <div class="logo"><span>SCOTTSDALE ARC</span> / TRAVEL PLANNER</div>
        <div class="status-badge">
            <div class="status-dot"></div>
            KEYLESS MODE ACTIVE
        </div>
    </header>

    <main>
        <div class="sidebar">
            <div class="card">
                <h3>Trip Planning</h3>
                <div class="input-group">
                    <label>Start Location</label>
                    <input type="text" id="origin-input" placeholder="e.g. Phoenix, AZ">
                </div>
                <div class="input-group">
                    <label>End Location</label>
                    <input type="text" id="destination-input" placeholder="e.g. Flagstaff, AZ">
                </div>
                <div class="input-group">
                    <label>Search Radius (Miles)</label>
                    <select id="buffer-input">
                        <option value="5">5 Miles</option>
                        <option value="10" selected>10 Miles</option>
                        <option value="25">25 Miles</option>
                        <option value="50">50 Miles</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Band Filter</label>
                    <select id="band-input">
                        <option value="all" selected>All Bands</option>
                        <option value="2m">2 Meters (144-148 MHz)</option>
                        <option value="70cm">70 Centimeters (420-450 MHz)</option>
                        <option value="1.25m">1.25 Meters (222-225 MHz)</option>
                    </select>
                </div>
                <button id="calculate-route">Calculate Route</button>
            </div>

            <div class="card">
                <h3>Repeater Database</h3>
                <div class="input-group">
                    <label>Data Source</label>
                    <select id="source-input" style="width: 100%; padding: 0.5rem; background: var(--surface); color: white; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 0.5rem;">
                        <option value="ard" selected>Master ARD (Open Source)</option>
                        <option value="custom">Custom Upload / Manual</option>
                    </select>
                </div>
                <div class="flex" style="gap: 0.5rem; margin-bottom: 1rem; display: flex;">
                    <button id="auto-fetch" class="secondary" style="flex: 1">Auto-Fetch ARD</button>
                    <button id="download-db" class="secondary" style="padding: 0.5rem; display: flex; align-items: center; justify-content: center;" title="Save Database to File">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    </button>
                </div>
                <div id="fetch-progress" style="font-size: 0.65rem; color: var(--text-dim); margin-top: 0.5rem;" class="hidden">
                    Syncing: <span id="progress-val">0%</span>
                </div>
                
                <div id="manual-upload" style="margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem;">
                    <p style="font-size: 0.7rem; color: var(--text-dim); margin-bottom: 0.5rem;">Upload RepeaterBook CSV or JSON:</p>
                    <input type="file" id="csv-upload" accept=".csv,.json" class="hidden">
                    <button class="secondary" onclick="document.getElementById('csv-upload').click()" style="font-size: 0.8rem; padding: 0.5rem; width: 100%;">Upload File</button>
                </div>
                <div id="file-status" style="font-size: 0.7rem; color: var(--accent); margin-top: 0.5rem;">No database loaded</div>
            </div>

            <div class="card">
                <h3>Radio Export</h3>
                <button id="export-chirp" disabled>Generate CHIRP CSV</button>
                <p style="font-size: 0.6rem; color: var(--text-dim); text-align: center; margin-top: 0.5rem;">
                    Format: Memory, Name, Freq, Duplex, Offset, Tone
                </p>
            </div>
        </div>

        <div id="map-container">
            <div id="map"></div>
            
            <div class="results-panel" id="results-panel">
                <div class="results-header">
                    <span style="font-weight: 800; font-size: 0.75rem; letter-spacing: 1px;">REPEATERS FOUND</span>
                    <span id="repeater-count" style="color: var(--accent); font-family: 'JetBrains Mono'; font-weight: 700;">0</span>
                </div>
                <div class="results-list" id="results-list">
                    <div style="text-align: center; color: var(--text-dim); padding-top: 3rem; font-size: 0.8rem;">
                        Waiting for route calculation...
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <script>
        // Global State
        let map, routeLayer, markersLayer;
        let repeaterDatabase = [];
        let filteredRepeaters = [];
        
        // Demo Data (AZ/CA Region)
        const demoData = [
            { Callsign: 'W7ARA', Frequency: '147.060', Offset: '+0.6', Tone: '162.2', Lat: '33.3444', Long: '-112.0000', Location: 'Phoenix, AZ', Elevation: 1100 },
            { Callsign: 'K7UGA', Frequency: '449.125', Offset: '-5.0', Tone: '100.0', Lat: '33.5000', Long: '-111.9333', Location: 'Scottsdale, AZ', Elevation: 1200 },
            { Callsign: 'W7MOT', Frequency: '146.940', Offset: '-0.6', Tone: '100.0', Lat: '33.3000', Long: '-111.8333', Location: 'Chandler, AZ', Elevation: 1150 },
            { Callsign: 'MtLemmon', Frequency: '147.300', Offset: '+0.6', Tone: '110.9', Lat: '32.4433', Long: '-110.7883', Location: 'Mt. Lemmon, AZ', Elevation: 2791 },
            { Callsign: 'PinalPeak', Frequency: '146.820', Offset: '-0.6', Tone: '100.0', Lat: '33.2811', Long: '-110.8211', Location: 'Pinal Peak, AZ', Elevation: 2390 },
            { Callsign: 'WhiteTank', Frequency: '146.940', Offset: '-0.6', Tone: '162.2', Lat: '33.5850', Long: '-112.5517', Location: 'White Tank Mtn, AZ', Elevation: 1225 }
        ];

        // Initialize Map
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([34.0, -111.0], 7);
            
            // Dark Matter Tiles (No Key)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
            }).addTo(map);

            L.control.zoom({ position: 'topleft' }).addTo(map);

            routeLayer = L.layerGroup().addTo(map);
            markersLayer = L.layerGroup().addTo(map);
        }

        // Geocoding with Nominatim (OSM)
        async function geocode(query) {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
            const data = await response.json();
            if (data.length > 0) {
                return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
            }
            throw new Error(`Location not found: ${query}`);
        }

        // Routing with OSRM
        async function getRoute(start, end) {
            const url = `https://router.project-osrm.org/route/v1/driving/${start.lon},${start.lat};${end.lon},${end.lat}?overview=full&geometries=geojson`;
            const response = await fetch(url);
            const data = await response.json();
            if (data.code === 'Ok') {
                return data.routes[0];
            }
            throw new Error('Routing failed');
        }

        // Filtering Algorithm
        function getDistance(p1, p2) {
            const R = 3958.8; // Earth radius in miles
            const dLat = (p2.lat - p1.lat) * Math.PI / 180;
            const dLon = (p2.lon - p1.lon) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(p1.lat * Math.PI / 180) * Math.cos(p2.lat * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function filterRepeaters(routeGeoJson, bufferMiles) {
            const db = repeaterDatabase.length > 0 ? repeaterDatabase : demoData;
            const band = document.getElementById('band-input').value;
            const coords = routeGeoJson.coordinates;
            filteredRepeaters = [];

            db.forEach(rep => {
                // Handle multiple field naming conventions (Frequency, outputFrequency, etc.)
                const freqStr = rep.outputFrequency || rep.Frequency || rep.frequency || "0";
                const repFreq = parseFloat(freqStr);
                
                const latVal = rep.latitude || rep.lat || rep.Lat || 0;
                const lonVal = rep.longitude || rep.lng || rep.Long || 0;
                
                const repLat = parseFloat(latVal);
                const repLon = parseFloat(lonVal);
                
                if (repFreq === 0 || repLat === 0 || repLon === 0) return;

                // Band Filtering
                if (band === '2m' && (repFreq < 144 || repFreq > 148)) return;
                if (band === '70cm' && (repFreq < 420 || repFreq > 450)) return;
                if (band === '1.25m' && (repFreq < 222 || repFreq > 225)) return;
                let minDist = Infinity;

                // Optimization: Sample route every 5 points
                for (let i = 0; i < coords.length; i += 5) {
                    const dist = getDistance({ lat: repLat, lon: repLon }, { lat: coords[i][1], lon: coords[i][0] });
                    if (dist < minDist) minDist = dist;
                    if (minDist < bufferMiles) break;
                }

                if (minDist <= bufferMiles) {
                    filteredRepeaters.push(rep);
                }
            });
            updateUI();
        }

        function updateUI() {
            markersLayer.clearLayers();
            const list = document.getElementById('results-list');
            const count = document.getElementById('repeater-count');
            const exportBtn = document.getElementById('export-chirp');

            count.innerText = filteredRepeaters.length;
            list.innerHTML = '';
            exportBtn.disabled = filteredRepeaters.length === 0;

            filteredRepeaters.forEach(rep => {
                const repLat = rep.lat || parseFloat(rep.Lat);
                const repLon = rep.lng || parseFloat(rep.Long);

                const item = document.createElement('div');
                item.className = 'repeater-item';
                const isHighAlt = rep.Elevation > 1500; // Over 1500m (~5000ft) is considered a mountain top
                
                item.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        ${isHighAlt ? '<span title="High Elevation / Mountain Top" style="font-size: 1.2rem;">🏔️</span>' : ''}
                        <div>
                            <div class="repeater-call">${rep.Callsign || 'N/A'}</div>
                            <div style="font-size: 0.75rem; color: var(--text-dim)">${rep.Location || ''} ${isHighAlt ? `(${Math.round(rep.Elevation)}m)` : ''}</div>
                        </div>
                    </div>
                    <div style="text-align: right">
                        <div class="repeater-freq">${rep.Frequency}</div>
                        <div style="font-size: 0.7rem; color: var(--accent)">${rep.Tone || rep.PL || 'No Tone'}</div>
                    </div>
                `;
                list.appendChild(item);

                L.circleMarker([repLat, repLon], {
                    radius: 6,
                    fillColor: "#00ff88",
                    color: "#fff",
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.8
                }).addTo(markersLayer).bindPopup(`<b>${rep.Callsign}</b><br>${rep.Frequency} MHz`);
            });
        }

        // UI Events
        document.getElementById('calculate-route').addEventListener('click', async () => {
            const btn = document.getElementById('calculate-route');
            const origin = document.getElementById('origin-input').value;
            const dest = document.getElementById('destination-input').value;
            const buffer = parseFloat(document.getElementById('buffer-input').value);

            if (!origin || !dest) return alert('Enter Start and End locations');
            
            btn.innerText = 'Calculating...';
            btn.disabled = true;

            try {
                const startCoord = await geocode(origin);
                const endCoord = await geocode(dest);
                const route = await getRoute(startCoord, endCoord);

                routeLayer.clearLayers();
                const polyline = L.geoJSON(route.geometry, {
                    style: { color: '#00ff88', weight: 5, opacity: 0.7 }
                }).addTo(routeLayer);

                map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
                filterRepeaters(route.geometry, buffer);
            } catch (err) {
                alert(err.message);
            } finally {
                btn.innerText = 'Calculate Route';
                btn.disabled = false;
            }
        });

        // Download Database Local Fix
        document.getElementById('download-db').addEventListener('click', () => {
            const db = repeaterDatabase.length > 0 ? repeaterDatabase : demoData;
            const dataStr = JSON.stringify(db, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = repeaterDatabase.length > 0 ? 'repeater_database_synced.json' : 'demo_database.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // Auto-Fetch from ARD GitHub
        const autoFetchBtn = document.getElementById('auto-fetch');
        const fetchProgress = document.getElementById('fetch-progress');
        const progressVal = document.getElementById('progress-val');
        const fileStatus = document.getElementById('file-status');

        autoFetchBtn.addEventListener('click', async () => {
            autoFetchBtn.disabled = true;
            autoFetchBtn.innerText = 'Syncing...';
            fetchProgress.classList.remove('hidden');
            progressVal.innerText = 'Initializing...';
            
            try {
                // Correct URL for the Master Repeater List
                const url = 'https://raw.githubusercontent.com/nathanbreitsch/ARD-RepeaterList/main/MasterList/MasterRepeater.json';
                const response = await fetch(url);
                
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                progressVal.innerText = 'Processing JSON...';
                const data = await response.json();
                
                // Flexible mapping for ARD schema
                repeaterDatabase = data.map(item => {
                    const loc = item.location || {};
                    return {
                        Callsign: item.callsign || item.Callsign || 'N/A',
                        Frequency: item.outputFrequency || item.frequency || item.Frequency || '0.00',
                        Offset: item.offset || item.Offset || '0.0',
                        PL: item.ctcssTx || item.tone || item.PL || item.Ctcss || '',
                        Lat: item.latitude || loc.lat || item.Lat || 0,
                        Long: item.longitude || loc.lng || item.Long || 0,
                        Location: item.nearestCity || loc.city || loc.county || item.Location || 'Unknown',
                        State: item.state || loc.state || item.State || ''
                    };
                });

                fileStatus.innerText = `Database Synced: ${repeaterDatabase.length} repeaters`;
                progressVal.innerText = '100% Complete';
                autoFetchBtn.innerText = 'Sync Successful';
                autoFetchBtn.style.borderColor = 'var(--border)';
                autoFetchBtn.style.color = 'var(--text-dim)';
            } catch (err) {
                console.error(err);
                let msg = 'Fetch Error: ' + err.message;
                
                // Specific help for local file protocol
                if (window.location.protocol === 'file:') {
                    msg = "🛡️ BROWSER SECURITY NOTICE\n\n" +
                          "You are running this app from a local file. Browsers block automatic data syncing in this mode.\n\n" +
                          "TWO WAYS TO FIX THIS:\n" +
                          "1. 🚀 RECOMMENDED: Run 'run_app.bat' (Windows) or 'run_app.sh' (Mac/Linux) to launch with a server.\n" +
                          "2. 📂 OFFLINE: Click the icon next to Auto-Fetch to download the data manually, then use 'Upload CSV'.";
                }
                
                alert(msg);
                fetchProgress.classList.add('hidden');
            } finally {
                autoFetchBtn.disabled = false;
            }
        });

        // CSV Upload (Manual Fallback)

        // CHIRP Export
        document.getElementById('export-chirp').addEventListener('click', () => {
            const headers = "Location,Name,Frequency,Duplex,Offset,Tone,rToneFreq,cToneFreq,DtcsCode,DtcsPolarity,Mode,TStep,Comment";
            let csv = headers + "\n";
            filteredRepeaters.forEach((rep, i) => {
                const duplex = rep.Offset === '0.00' || rep.Offset === 0 ? '' : (parseFloat(rep.Offset) > 0 ? '+' : '-');
                const hasTone = rep.PL && rep.PL !== 'None' && rep.PL !== '';
                const row = [
                    i+1, (rep.Callsign || 'REP').slice(0,10), rep.Frequency, duplex, 
                    Math.abs(parseFloat(rep.Offset||0.6)), hasTone ? 'Tone' : 'None', 
                    rep.PL||'88.5', rep.PL||'88.5', '023', 'NN', 'FM', '5.00', rep.Location
                ];
                csv += row.join(',') + "\n";
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'chirp_route.csv';
            a.click();
        });

        initMap();
    </script>
</body>
</html>
